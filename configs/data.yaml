# Конфигурация датасета Ф0.
# Пути: raw_root лежит локально, preproc_root уедет на GPU-машину.
paths:
  raw_root: data                # исходная выгрузка WB (SKU-папки)
  cache_root: cache             # лёгкие артефакты: манифесты, разметка, сплиты
  preproc_root: null            # тяжёлый кэш (поза/parsing/латенты). null = ещё не задан

layout:
  product_dir: "Фото товара"
  review_dir: "Фото с отзывов"
  info_file: info.csv

# 18 сырых категорий WB -> укрупнённые группы для обучения.
# Явно и в конфиге, чтобы решение было воспроизводимо и проверяемо в отчёте.
categories:
  upper:
    - Футболки и топы
    - Джемперы, водолазки и кардиганы
    - Блузки и рубашки
    - Лонгсливы
    - Толстовки, свитшоты и худи
    - Туники
    - Пиджаки, жилеты и жакеты
  lower:
    - Джинсы
    - Брюки
    - Юбки
    - Шорты
  dress:
    - Платья и сарафаны
  outer:
    - Верхняя одежда
  fullbody:
    - Комбинезоны
  # Исключаются: human parsing на белье/купальниках нестабилен,
  # а объёма всё равно не хватает для отдельной группы.
  drop:
    - Белье
    - Пляжная мода
    - Одежда для дома
    - Халаты

# Группы мельче этого порога отбрасываются автоматически (fullbody: 2 SKU).
min_sku_per_group: 50

# Поля info.csv, выносимые в типизированные колонки.
# Остальные 20+ ключей уходят в JSON-колонку attrs_json.
info_columns:
  - Категория
  - Название
  - Сезон
  - Покрой
  - Тип посадки
  - Вырез горловины
  - Тип рукава
  - Размер на модели
  - Рост модели на фото
  - Параметры модели на фото (ОГ-ОТ-ОБ)
  - Цвет
